# Build EVRe Studio and its tools, and run the tests, on Linux and Windows.
# Every test that writes does it to a fake device or a simulator the job starts itself.
name: ci

# a push to a branch is tested by its pull request (merged with main); main itself on every push
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: EVRe

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's own Qt is 6.4; the Studio needs 6.5 or newer
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtserialport
          cache: true
      - name: CMake, Ninja, xvfb, jsonschema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 fonts-dejavu-core xvfb xauth
          pip install jsonschema
      - name: The compilers of the library's build matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib gcc-avr avr-libc g++-multilib
      - name: The library's suite (1.1 and EVRe Guard)
        run: python3 tests/run_lib_tests.py
      - name: Build
        run: |
          cmake -S studio -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Map files and exports
        run: ./build/evre_map_test
      - name: JSON Schema
        run: python3 studio/tests/schema_test.py
      - name: evre command line
        run: python3 studio/tests/cli_test.py build
      - name: evre-sim
        run: python3 studio/tests/sim_test.py build
      - name: Device table, compiled with lib/EVRe.cpp
        run: python3 studio/tests/device_table_test.py build
      - name: Python package
        run: EVRE_BUILD=build python3 -m unittest discover -s studio/python/tests
      - name: GUI test (against the fake device, on a virtual screen)
        run: |
          python3 studio/tests/fake_device.py --port 1210 --map studio/maps/example_device.json &
          sleep 2
          cd build && QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1920x1200x24' ./evre_gui_test example_device.json
      - name: Login of the fake devices
        run: python3 studio/tests/fake_login_test.py build

  windows:
    runs-on: windows-2022
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          modules: qtserialport
          tools: "tools_mingw1310 tools_ninja"
          cache: true
      - name: Build
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$IQTA_TOOLS/Ninja:$PATH"
          cmake -S studio -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: The library's suite (1.1 and EVRe Guard)
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          # the cross-compilers and the 32-bit libraries of the build matrix are installed on Linux only
          python tests/run_lib_tests.py --skip m32,arm-none-eabi-g++,avr-g++
      - name: Tests without a window
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$QT_ROOT_DIR/bin:$PATH"
          ./build/evre_map_test
          python studio/tests/cli_test.py build
          python studio/tests/sim_test.py build
          python studio/tests/device_table_test.py build
          EVRE_BUILD=build python -m unittest discover -s studio/python/tests
