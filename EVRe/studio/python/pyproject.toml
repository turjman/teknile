# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evre"
version = "1.0.0"
description = "EVRe devices from Python, by register name, with the device's map"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.4"]

[tool.setuptools]
packages = ["evre"]
